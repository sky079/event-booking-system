server.port=${PORT:8080}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/ebs}
spring.datasource.username=${DB_USER:ebs}
spring.datasource.password=${DB_PASSWORD:ebs}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics

app.jwt.secret=${JWT_SECRET:local-dev-secret-change-me-must-be-32-chars-min}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}
app.bcrypt-strength=${BCRYPT_STRENGTH:10}